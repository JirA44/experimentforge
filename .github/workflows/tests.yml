name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m compileall -q apps tests
      - name: Vérifier OpenAPI statique égal au runtime et version
        shell: bash
        run: python -c "import yaml; from apps.api.main import app; s=yaml.safe_load(open('packages/contracts/openapi.yaml', encoding='utf-8')); r=app.openapi(); assert s==r; assert s['openapi']=='3.1.0'; assert s['info']['version']=='1.0.6'"
