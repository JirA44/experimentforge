components:
  schemas:
    AuditEvent:
      properties:
        sequence:
          type: integer
          title: Sequence
        event_type:
          type: string
          title: Event Type
        entity_type:
          type: string
          title: Entity Type
        entity_id:
          type: string
          title: Entity Id
        payload:
          additionalProperties: true
          type: object
          title: Payload
        previous_event_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Previous Event Hash
        event_hash:
          type: string
          title: Event Hash
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - sequence
      - event_type
      - entity_type
      - entity_id
      - payload
      - event_hash
      - created_at
      title: AuditEvent
    DeviationFinding:
      properties:
        category:
          type: string
          title: Category
        code:
          type: string
          title: Code
        material:
          type: boolean
          title: Material
        observed:
          title: Observed
        planned:
          title: Planned
        detail:
          type: string
          title: Detail
      additionalProperties: false
      type: object
      required:
      - category
      - code
      - material
      - observed
      - planned
      - detail
      title: DeviationFinding
    DeviationReportCreate:
      properties:
        experiment_id:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Experiment Id
        protocol_version:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Protocol Version
        evaluation_id:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Evaluation Id
      additionalProperties: false
      type: object
      title: DeviationReportCreate
    DeviationVerdict:
      type: string
      enum:
      - ADHERENT
      - MINOR_DEVIATIONS
      - MATERIAL_DEVIATIONS
      - INSUFFICIENT
      - INCOMPATIBLE
      title: DeviationVerdict
    Direction:
      type: string
      enum:
      - greater
      - less
      - different
      title: Direction
    EffectStabilityCompatibility:
      properties:
        same_experiment:
          type: boolean
          title: Same Experiment
        hypothesis_statement:
          type: boolean
          title: Hypothesis Statement
        metric_name:
          type: boolean
          title: Metric Name
        metric_unit:
          type: boolean
          title: Metric Unit
        group_roles:
          type: boolean
          title: Group Roles
        direction:
          type: boolean
          title: Direction
        analysis_method:
          type: boolean
          title: Analysis Method
      additionalProperties: false
      type: object
      required:
      - same_experiment
      - hypothesis_statement
      - metric_name
      - metric_unit
      - group_roles
      - direction
      - analysis_method
      title: EffectStabilityCompatibility
    EffectStabilityDossier:
      properties:
        id:
          type: string
          title: Id
        evaluation_ids:
          items:
            type: string
          type: array
          title: Evaluation Ids
        experiment_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Experiment Id
        qualification:
          $ref: '#/components/schemas/EffectStabilityQualification'
        compatibility:
          $ref: '#/components/schemas/EffectStabilityCompatibility'
        evaluations:
          items:
            $ref: '#/components/schemas/EffectStabilityEvaluationSnapshot'
          type: array
          title: Evaluations
        transitions:
          items:
            $ref: '#/components/schemas/EffectStabilityTransition'
          type: array
          title: Transitions
        relative_range:
          anyOf:
          - type: number
          - type: 'null'
          title: Relative Range
        worst_transition:
          anyOf:
          - $ref: '#/components/schemas/EffectStabilityTransition'
          - type: 'null'
        method:
          type: string
          title: Method
          default: protocol-version-effect-stability-v1
        relative_delta_threshold:
          type: number
          title: Relative Delta Threshold
          default: 0.1
        dossier_hash:
          type: string
          title: Dossier Hash
        immutable:
          type: boolean
          title: Immutable
          default: true
        reproducible:
          type: boolean
          title: Reproducible
          default: true
        idempotent_replay:
          type: boolean
          title: Idempotent Replay
          default: false
        created_at:
          type: string
          format: date-time
          title: Created At
        warning:
          type: string
          title: Warning
          default: Ce dossier décrit la stabilité des effets entre ces versions de
            protocole ; il ne certifie ni causalité, ni validité externe, ni vérité.
      additionalProperties: false
      type: object
      required:
      - id
      - evaluation_ids
      - qualification
      - compatibility
      - evaluations
      - transitions
      - dossier_hash
      - created_at
      title: EffectStabilityDossier
    EffectStabilityDossierCreate:
      properties:
        evaluation_ids:
          items:
            type: string
          type: array
          maxItems: 50
          minItems: 2
          title: Evaluation Ids
      additionalProperties: false
      type: object
      required:
      - evaluation_ids
      title: EffectStabilityDossierCreate
      description: Only persisted evaluation identifiers are accepted from the client.
    EffectStabilityEvaluationSnapshot:
      properties:
        evaluation_id:
          type: string
          title: Evaluation Id
        experiment_id:
          type: string
          title: Experiment Id
        protocol_version:
          type: integer
          title: Protocol Version
        protocol_hash:
          type: string
          title: Protocol Hash
        evaluation_hash:
          type: string
          title: Evaluation Hash
        observations_snapshot_hash:
          type: string
          title: Observations Snapshot Hash
        effect:
          anyOf:
          - type: number
          - type: 'null'
          title: Effect
        interval95:
          $ref: '#/components/schemas/Interval95'
      additionalProperties: false
      type: object
      required:
      - evaluation_id
      - experiment_id
      - protocol_version
      - protocol_hash
      - evaluation_hash
      - observations_snapshot_hash
      - interval95
