openapi: 3.1.0
info:
  title: ExperimentForge API
  description: 'Registre d''expériences reproductibles : hypothèses et protocoles
    immuables, observations brutes append-only, évaluations, réplications et synthèses
    multi-expériences, diagnostics d''influence, écarts au protocole, stabilité d''effet
    et couverture des preuves de réplication.'
  version: 1.0.7
